<!DOCTYPE html>
<html>
<body>
  <button id="btn">Download ISO</button>
  <pre id="log">Initializing...</pre>

  <script>
    const log = (t) => (document.getElementById('log').textContent = t);

    (async () => {
      await navigator.serviceWorker.register('./sw.js');
      await navigator.serviceWorker.ready;
      if (!navigator.serviceWorker.controller) {
        await new Promise((r) => navigator.serviceWorker.addEventListener('controllerchange', r, { once: true }));
      }
      setInterval(() => navigator.serviceWorker.controller?.postMessage('ping'), 5000);
      log('Ready.');
    })();

    document.getElementById('btn').onclick = () => {
      log('Downloading — check Ctrl+J. Keep this tab open.');
      const a = document.createElement('a');
      a.href = './download-iso';
      a.download = 'pop-os_24.04_amd64_nvidia_25.iso';
      a.click();
    };
  </script>
</body>
</html>
