<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Download Pop!_OS ISO</title>
</head>
<body>
  <button id="btn">Download Pop!_OS ISO (8 Parts)</button>
  <pre id="log">Initializing...</pre>

  <script>
    const log = (msg) => (document.getElementById('log').textContent = msg);

    async function init() {
      const reg = await navigator.serviceWorker.register('./sw.js');
      await navigator.serviceWorker.ready;
      if (!navigator.serviceWorker.controller) {
        await new Promise((r) =>
          navigator.serviceWorker.addEventListener('controllerchange', r, { once: true })
        );
      }
      log('Ready. Click to start download in Firefox Download Manager.');
    }

    init().catch((e) => log(`SW Error: ${e.message}`));

    document.getElementById('btn').onclick = () => {
      log('Download started — check Firefox Downloads (Ctrl+J) for progress.');
      window.location.href = './download-merged-iso';
    };
  </script>
</body>
</html>
